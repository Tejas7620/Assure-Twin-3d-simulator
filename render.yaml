services:
  - type: web
    name: assure-twin-simulator
    runtime: docker
    dockerfilePath: Dockerfile
    plan: standard
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./assure_twin.db
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
